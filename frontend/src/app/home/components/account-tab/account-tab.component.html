<!-- Profile Section -->
<section class="flex flex-col items-center justify-center pt-4 pb-6">
  <div class="relative w-20 h-20 mb-3">
    <!-- User avatar mock or placeholder using person icon -->
    <div class="w-full h-full rounded-full bg-slate-100 border-2 border-slate-200 shadow-sm flex items-center justify-center text-[#002d4b] text-3xl font-extrabold">
      <ion-icon name="person-outline"></ion-icon>
    </div>
  </div>
  <h2 class="font-bold text-base text-[#002d4b] m-0 mb-0.5" *ngIf="userName">{{ userName }}</h2>
  <p class="text-xs text-slate-500 m-0" *ngIf="userEmail">{{ userEmail }}</p>
</section>

<!-- Preference Node Card -->
<section class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 flex flex-col gap-3 relative overflow-hidden">
  <div class="absolute top-0 right-0 w-32 h-32 bg-[#006b4d]/5 rounded-bl-full -z-10"></div>
  
  <div class="flex justify-between items-start">
    <div>
      <h3 class="text-[9px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Punto de Retiro de Preferencia</h3>
      
      <div *ngIf="activeNode" class="flex items-center gap-1.5 text-[#006b4d] mt-1">
        <ion-icon name="business-outline" class="text-base"></ion-icon>
        <p class="text-xs font-bold m-0">{{ activeNode.name }}</p>
      </div>
      <div *ngIf="!activeNode" class="flex items-center gap-1.5 text-red-600 mt-1">
        <ion-icon name="help-circle-outline" class="text-base"></ion-icon>
        <p class="text-xs font-bold m-0">No seleccionado</p>
      </div>
    </div>
  </div>
  
  <p class="text-xs text-slate-500 m-0" *ngIf="activeNode">{{ activeNode.address }}</p>
  
  <ion-button 
    expand="block"
    fill="outline"
    routerLink="/pages/select-node"
    class="[--color:#006b4d] [--border-color:#e2e8f0] font-bold text-xs h-9 m-0 mt-1">
    <ion-icon name="swap-horizontal-outline" slot="start" class="mr-1"></ion-icon>
    Cambiar Punto de Retiro
  </ion-button>
</section>

<!-- Account Options List -->
<section class="flex flex-col gap-2 mt-4">
  <h3 class="text-[9px] font-bold text-slate-400 px-1 uppercase tracking-wider mb-1">Opciones de Cuenta</h3>
  
  <a class="flex items-center justify-between p-3 bg-white rounded-xl shadow-sm border border-slate-100 hover:bg-slate-50 active:scale-[0.98] transition-all" href="#">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-emerald-50 text-[#006b4d] flex items-center justify-center text-base">
        <ion-icon name="swap-horizontal-outline"></ion-icon>
      </div>
      <span class="text-xs text-slate-700 font-semibold">Historial de Compras</span>
    </div>
    <ion-icon name="chevron-forward-outline" class="text-slate-400 text-sm"></ion-icon>
  </a>
  
  <a class="flex items-center justify-between p-3 bg-white rounded-xl shadow-sm border border-slate-100 hover:bg-slate-50 active:scale-[0.98] transition-all" href="#">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-emerald-50 text-[#006b4d] flex items-center justify-center text-base">
        <ion-icon name="help-circle-outline"></ion-icon>
      </div>
      <span class="text-xs text-slate-700 font-semibold">Ayuda y Soporte</span>
    </div>
    <ion-icon name="chevron-forward-outline" class="text-slate-400 text-sm"></ion-icon>
  </a>
</section>

<!-- Logout Button -->
<div class="mt-6 pt-4 border-t border-slate-100 flex justify-center">
  <ion-button 
    fill="clear" 
    class="[--color:#dc2626] font-bold text-xs m-0"
    (click)="onLogout()">
    <ion-icon name="log-out-outline" slot="start" class="mr-1"></ion-icon>
    Cerrar sesión
  </ion-button>
</div>

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Redecos
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" color="danger">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Redecos</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container" class="ion-padding ion-text-center">
    <h1>¡Bienvenido a Redecos!</h1>
    <p class="subtitle" style="font-size: 1.1rem; color: var(--ion-color-medium); margin-top: -8px; margin-bottom: 24px;">Red de compras soberanas</p>
    <p>Iniciaste sesión correctamente.</p>
  </div>
</ion-content>

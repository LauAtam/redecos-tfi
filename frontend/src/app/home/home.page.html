<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Redecos
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" color="danger">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Redecos</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container" class="absolute left-0 right-0 top-1/2 -translate-y-1/2 text-center px-4">
    <h1 class="text-2xl font-bold">¡Bienvenido a Redecos!</h1>
    <p class="text-[1.1rem] text-[var(--ion-color-medium)] -mt-2 mb-6">Red de compras soberanas</p>
    <p class="text-base leading-[22px] text-[#8c8c8c] m-0">Iniciaste sesión correctamente.</p>
  </div>
</ion-content>

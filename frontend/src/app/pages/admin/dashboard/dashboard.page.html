<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Panel de Administración</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" aria-label="Cerrar sesión">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="welcome-container ion-text-center ion-margin-bottom">
    <h2>¡Bienvenido, Administrador!</h2>
    <p class="ion-text-muted" *ngIf="adminEmail">{{ adminEmail }}</p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6">
        <ion-card class="dashboard-card" routerLink="/admin/nodos" button="true">
          <ion-card-header>
            <div class="icon-container nodos-color">
              <ion-icon name="business-outline"></ion-icon>
            </div>
            <ion-card-title>Gestión de Nodos</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar los nodos de distribución, ver detalles y crear nuevos puntos de la red.
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6">
        <ion-card class="dashboard-card" routerLink="/admin/productos" button="true">
          <ion-card-header>
            <div class="icon-container productos-color">
              <ion-icon name="cube-outline"></ion-icon>
            </div>
            <ion-card-title>Gestión de Productos</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Visualizar el catálogo, crear nuevos productos y administrar existencias en el sistema.
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

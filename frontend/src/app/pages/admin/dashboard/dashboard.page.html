<app-header title="Panel de Administración" [showLogout]="true" (logout)="logout()"></app-header>

<ion-content class="[--background:#f8fafc] ion-padding">
  <div class="max-w-[600px] mx-auto py-4 px-2">
    
    <!-- Banner de Bienvenida -->
    <div class="bg-gradient-to-br from-[#002d4b] to-[#004b7c] rounded-[20px] p-6 text-white mb-6 shadow-[0_8px_24px_rgba(0,45,75,0.15)]">
      <div class="mb-3">
        <h2 class="m-0 text-2xl font-bold">¡Hola, Administrador! 👋</h2>
        @if (adminEmail) {
          <p class="m-0 mt-1 text-[0.90rem] text-[#93c5fd] font-medium">{{ adminEmail }}</p>
        }
      </div>
      <p class="m-0 text-[0.95rem] leading-normal opacity-90">Gestioná los nodos de retiro y el catálogo de productos de la Red de compras soberanas.</p>
    </div>

    <!-- Contenedor de Tarjetas de Navegación -->
    <div class="flex flex-col gap-1.5">
      <ion-card class="m-0 rounded-[12px] bg-white border border-[#e8e8e8] shadow-[0_2px_8px_rgba(0,0,0,0.03)] overflow-hidden transition-all duration-200" routerLink="/admin/nodos" button="true">
        <ion-item lines="none" class="[--background:transparent] [--padding-start:16px] [--padding-end:16px] [--inner-padding-end:0] py-2">
          <div slot="start" class="flex items-center justify-center w-12 h-12 rounded-[8px] bg-[#f1f5f9] text-[#002d4b] mr-2">
            <ion-icon name="business-outline" class="text-[1.4rem]"></ion-icon>
          </div>
          <ion-label class="m-0">
            <h2 class="m-0 text-[1rem] font-bold text-[#002d4b]">Gestión de Nodos</h2>
          </ion-label>
          <ion-icon slot="end" name="chevron-forward-outline" class="text-[1.2rem] text-[#a0aec0] mr-4"></ion-icon>
        </ion-item>
      </ion-card>

      <ion-card class="m-0 rounded-[12px] bg-white border border-[#e8e8e8] shadow-[0_2px_8px_rgba(0,0,0,0.03)] overflow-hidden transition-all duration-200" routerLink="/admin/productos" button="true">
        <ion-item lines="none" class="[--background:transparent] [--padding-start:16px] [--padding-end:16px] [--inner-padding-end:0] py-2">
          <div slot="start" class="flex items-center justify-center w-12 h-12 rounded-[8px] bg-[#f1f5f9] text-[#002d4b] mr-2">
            <ion-icon name="cube-outline" class="text-[1.4rem]"></ion-icon>
          </div>
          <ion-label class="m-0">
            <h2 class="m-0 text-[1rem] font-bold text-[#002d4b]">Gestión de Productos</h2>
          </ion-label>
          <ion-icon slot="end" name="chevron-forward-outline" class="text-[1.2rem] text-[#a0aec0] mr-4"></ion-icon>
        </ion-item>
      </ion-card>
    </div>

  </div>
</ion-content>

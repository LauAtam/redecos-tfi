<app-header title="Redecos" [showLogout]="false">
</app-header>

<ion-content
  class="[--background:radial-gradient(circle_at_center,#ffffff_0%,#f9f9fb_100%)] ion-padding ion-text-center">
  <div class="flex flex-col items-center justify-center h-full max-w-[400px] mx-auto">

    <!-- Icono de Bloqueo -->
    <div class="mb-10">
      <div class="relative w-[140px] h-[140px] bg-[rgba(190,30,45,0.05)] rounded-full flex items-center justify-center">
        <ion-icon name="lock-closed" class="text-[80px] text-[#be1e2d]"></ion-icon>
        <div
          class="absolute bottom-[15px] right-[15px] w-10 h-10 bg-[#be1e2d] border-[3px] border-white rounded-full flex items-center justify-center text-white">
          <ion-icon name="person-outline" class="text-[20px]"></ion-icon>
        </div>
      </div>
    </div>

    <!-- Mensaje -->
    <div class="mb-10">
      <h1 class="text-3xl font-extrabold text-[#002d4b] mb-4">Acceso Restringido</h1>
      <p class="text-[1.05rem] text-[#666666] leading-normal px-5">
        No tienes los permisos necesarios para ver esta página.
        Esta sección es exclusiva para Administradores y Nodos.
      </p>
    </div>

    <!-- Botón Volver -->
    <ion-button expand="block" routerLink="/home"
      class="[--background:#006b4d] [--background-activated:#00523a] [--border-radius:16px] h-14 font-bold text-[1.1rem] normal-case w-full mb-6">
      <ion-icon slot="start" name="storefront-outline"></ion-icon>
      Volver al Catálogo
    </ion-button>

    <!-- Ayuda -->
    <div>
      <ion-button fill="clear" color="medium" size="small" class="font-semibold normal-case">
        <ion-icon slot="start" name="help-circle-outline"></ion-icon>
        ¿Necesitas ayuda con tu cuenta?
      </ion-button>
    </div>

  </div>
</ion-content>

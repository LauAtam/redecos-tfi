<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      @if (showCustomBack) {
        <ion-button (click)="onCustomBack()" aria-label="Volver atrás">
          <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
        </ion-button>
      }
      @if (defaultHref && !showCustomBack) {
        <ion-back-button [defaultHref]="defaultHref" text="" icon="arrow-back-outline" aria-label="Volver atrás"></ion-back-button>
      }
    </ion-buttons>

    <ion-title>{{ title }}</ion-title>

    @if (showLogout) {
      <ion-buttons slot="end">
        <ion-button (click)="onLogout()" class="logout-button" aria-label="Cerrar sesión">
          <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>
